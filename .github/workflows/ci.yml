name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: サンプル問題データの検証
        run: dart run ukalab_core:validate_content example/sample_exam.json --update-log example/sample_update_log.jsonl --next-steps example/sample_next_steps.jsonl --checklist example/sample_checklist.jsonl example/sample_questions.jsonl example/sample_question_types.jsonl
  peer-stats-functions:
    # 匿名集計の Cloud Functions（ローカルのユニットテストのみ。デプロイはしない）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
  firestore-rules-emulator:
    # Firestore ルールをエミュレータで検査（配備はしない。本番・開発プロジェクトには触れない）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/emulator_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx firebase emulators:exec --only firestore --project demo-peer "node peer_rules.test.mjs"
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r tools/icon_gen/requirements.txt
      - run: python -m unittest discover -s tools/icon_gen -v
      - run: python tools/icon_gen/icon_gen.py --spec tools/icon_gen/specs/sample.json --out build/icons
      - run: python tools/icon_gen/check_icons.py --spec tools/icon_gen/specs/sample.json --out build/icons
      - uses: actions/upload-artifact@v4
        with:
          name: icons
          path: build/icons
  question-quality-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools/question_quality -v
  question-quality-reusable:
    # 各アプリが呼ぶ再利用可能ワークフローの動作確認（この PR/コミットのツールで実行）
    uses: ./.github/workflows/question-quality.yml
    with:
      files: 'example/sample_questions.jsonl example/sample_question_types.jsonl'
      core_ref: ${{ github.sha }}
