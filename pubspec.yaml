name: ukalab_core
description: "うかラボ（成人向け検定アプリ）の共通エンジンとUI。ExamConfig・問題モデル・問題データ検証・模擬試験の採点・間隔反復・演習セッションと、推し・衣装・コイン・テーマ・学習ラボのUI。"
version: 0.84.0
publish_to: 'none'

environment:
  sdk: ^3.9.0
  flutter: ">=1.17.0"

# 依存の向き: アプリ → ukalab_core → app_common_kit。
# `package:ukalab_core/ukalab_core.dart` は純Dart（検証CLIなど）、`package:ukalab_core/ui.dart` は Flutter の UI。
dependencies:
  flutter:
    sdk: flutter
  app_common_kit:
    git:
      url: https://github.com/zka32101/app_common_kit.git
      ref: v4.0.0
  flutter_riverpod: ^2.6.1
  # 学習履歴などの書き出し（lib/ui/file_export）。ShareParams API（11 以降）を使う。
  share_plus: ">=11.0.0 <14.0.0"
  web: ">=1.0.0 <2.0.0"
  shared_preferences: ^2.3.0
  cloud_firestore: ">=5.0.0 <7.0.0"
  # 相互紹介（lib/cross_promo.dart）。firebase_core は cloud_firestore と同じ世代に収まる範囲、
  # firebase_remote_config は cross_promo_kit の許容レンジ（>=4.0.0 <7.0.0）に合わせる。
  firebase_core: ">=3.0.0 <5.0.0"
  firebase_remote_config: ">=4.0.0 <7.0.0"
  cross_promo_kit:
    git:
      url: https://github.com/zka32101/cross_promo_kit
      ref: v0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: BIZUDPGothic
      fonts:
        - asset: assets/fonts/BIZUDPGothic-Regular.ttf
        - asset: assets/fonts/BIZUDPGothic-Bold.ttf
          weight: 700
  assets:
    - assets/mascot/rooms/
    - assets/mascot/props/
    - assets/mascot/medals/
    - assets/mascot/kai/
    - assets/mascot/kai/outfits/
    - assets/mascot/kai/scenes/
    - assets/mascot/kai/guide/
    - assets/mascot/kai/poses/
    - assets/mascot/kai/states/
    - assets/mascot/kai/items/
    - assets/mascot/mio/
    - assets/mascot/mio/outfits/
    - assets/mascot/mio/scenes/
    - assets/mascot/mio/guide/
    - assets/mascot/mio/poses/
    - assets/mascot/mio/states/
    - assets/mascot/mio/items/
    - assets/mascot/moka/
    - assets/mascot/moka/outfits/
    - assets/mascot/moka/scenes/
    - assets/mascot/moka/guide/
    - assets/mascot/moka/poses/
    - assets/mascot/moka/states/
    - assets/mascot/moka/items/
    - assets/mascot/mike/
    - assets/mascot/mike/outfits/
    - assets/mascot/mike/scenes/
    - assets/mascot/mike/guide/
